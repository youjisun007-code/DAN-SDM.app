services:
  - type: web
    name: dna-sdm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --worker-class gthread --workers 2 --threads 16 --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STUDENT_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CLAUDE_MODEL
        value: claude-opus-5
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        sync: false
      - key: GOOGLE_SHEETS_WEBHOOK_TOKEN
        sync: false
